<!doctype html><html lang="zh"><meta charset="utf-8"><title>v1配置示例</title><h1>旧Transport配置页</h1>
<button id="load">读取原配置</button><button id="save">保存空配置</button><button id="test">测试配置</button><pre id="result"></pre>
<script src="bridge.js" data-bridge-version="1"></script><script>for(const [id,type,values] of [['load','config.load',{}],['save','config.save',{config:{}}],['test','config.test',{}]])document.getElementById(id).onclick=()=>bridge.request(type,values).then(result=>document.getElementById('result').textContent=JSON.stringify(result,null,2)).catch(error=>document.getElementById('result').textContent=error.message);</script></html>
